# The dashboard template extends the Sylius admin layout, which asks Encore for its entry points.
# Without `yarn build`, the `entrypoints.json` file does not exist and the whole page dies in a
# 500 — including the parts that have nothing to do with the assets.
#
# The functional test is about the content of our page, not about the Sylius asset pipeline: in
# non-strict mode, a missing entry point renders nothing instead of throwing. A real visual check
# would ask for a `yarn build` — that is another need.
webpack_encore:
    strict_mode: false
