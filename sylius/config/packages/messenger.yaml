framework:
    messenger:
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        # failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            # async: '%env(MESSENGER_TRANSPORT_DSN)%'
            # failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            # Route your messages to the transports
            # 'App\Message\YourMessage': async

# when@test:
#    framework:
#        messenger:
#            transports:
#                # replace with your transport name here (e.g., my_transport: 'in-memory://')
#                # For more Messenger testing tools, see https://github.com/zenstruck/messenger-test
#                async: 'in-memory://'

# The Nexus transport lives in the profile that serves, and the journal transport in the one that
# calls. Both are `temporal://`: declaring them elsewhere would make `doctrine:schema:create` fail,
# for want of a DSN (see `durable.yaml`).
when@demo:
    framework:
        messenger:
            transports:
                # Receive-only: each `get()` long-polls an incoming Nexus task and serves it
                # through `TemporalNexusWorker`. There is no Sylius queue behind it — the name
                # designates a poll loop, not a message queue.
                #
                #   bin/console messenger:consume durable_temporal_nexus
                durable_temporal_nexus:
                    dsn: '%env(DURABLE_TEMPORAL_DSN)%'
                    options:
                        purpose: nexus_worker

when@demo_caller:
    framework:
        messenger:
            transports:
                # The workflow task worker of the calling profile. It is the one that drives
                # `OrderWorkflow` between its two calls — and that resumes it after the wait,
                # without it necessarily being the same process that had started it.
                durable_temporal_journal:
                    dsn: '%env(DURABLE_TEMPORAL_DSN)%'
