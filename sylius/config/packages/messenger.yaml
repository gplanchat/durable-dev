framework:
    messenger:
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        # failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            # async: '%env(MESSENGER_TRANSPORT_DSN)%'
            # failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

            # La boucle qui sert Nexus. Le transport est *receive-only* : chaque `get()` long-poll
            # une tâche entrante et la sert par `TemporalNexusWorker`. Il n'y a donc pas de file
            # Sylius derrière — le nom `durable_temporal_nexus` désigne une boucle de poll, pas une
            # file de messages.
            #
            #   bin/console messenger:consume durable_temporal_nexus
            #
            # Sans `DURABLE_TEMPORAL_DSN`, le transport est déclaré et jamais instancié : le reste
            # de la boutique ne le touche pas.
            durable_temporal_nexus:
                dsn: '%env(DURABLE_TEMPORAL_DSN)%'
                options:
                    purpose: nexus_worker

        routing:
            # Route your messages to the transports
            # 'App\Message\YourMessage': async

# when@test:
#    framework:
#        messenger:
#            transports:
#                # replace with your transport name here (e.g., my_transport: 'in-memory://')
#                # For more Messenger testing tools, see https://github.com/zenstruck/messenger-test
#                async: 'in-memory://'

when@demo:
    framework:
        messenger:
            transports:
                # Le worker de tâches de workflow du profil appelant. C'est lui qui fait avancer
                # `CommandeWorkflow` entre ses deux appels — et qui le reprend après l'attente,
                # sans que ce soit forcément le même processus qui l'avait démarré.
                durable_temporal_journal:
                    dsn: '%env(DURABLE_TEMPORAL_DSN)%'
