# The five durable messages ride Doctrine, on the shop's own database, in every environment
# whose journal is SQL — `demo` included, whose DSN only serves Nexus. Nothing rides `sync`: a
# resume run inside the request that sent it holds the resume lock the request already holds, and
# the first timer deadlocks (#361). The bundle refuses to compile otherwise (#259).
#
# `demo_caller` declares none of this: its journal is the cluster, the Durable bundle registers
# `durable_workflows` and `durable_activities` itself, and refuses an application that declares
# them too.
framework:
    messenger:
        transports:
            sync: 'sync://'

when@dev: &durable_messages
    framework:
        messenger:
            transports:
                durable_workflows:  'doctrine://default?queue_name=durable_workflows'
                durable_activities: 'doctrine://default?queue_name=durable_activities'
            routing:
                Gplanchat\Durable\Transport\ResumeWorkflowMessage:        durable_workflows
                Gplanchat\Durable\Transport\FireWorkflowTimersMessage:    durable_workflows
                Gplanchat\Durable\Transport\DeliverWorkflowSignalMessage: durable_workflows
                Gplanchat\Durable\Transport\DeliverWorkflowUpdateMessage: durable_workflows
                Gplanchat\Durable\Transport\ActivityMessage:              durable_activities

when@test: *durable_messages
when@prod: *durable_messages
when@demo: *durable_messages
