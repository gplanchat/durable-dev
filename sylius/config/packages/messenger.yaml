framework:
    messenger:
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        # failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            # async: '%env(MESSENGER_TRANSPORT_DSN)%'
            # failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            # Route your messages to the transports
            # 'App\Message\YourMessage': async

# when@test:
#    framework:
#        messenger:
#            transports:
#                # replace with your transport name here (e.g., my_transport: 'in-memory://')
#                # For more Messenger testing tools, see https://github.com/zenstruck/messenger-test
#                async: 'in-memory://'

# Le transport Nexus vit dans le profil qui sert, et le transport de journal dans celui qui appelle.
# Les deux sont `temporal://` : les déclarer ailleurs ferait échouer `doctrine:schema:create`, faute
# de DSN (voir `durable.yaml`).
when@demo:
    framework:
        messenger:
            transports:
                # Receive-only : chaque `get()` long-poll une tâche Nexus entrante et la sert par
                # `TemporalNexusWorker`. Il n'y a pas de file Sylius derrière — le nom désigne une
                # boucle de poll, pas une file de messages.
                #
                #   bin/console messenger:consume durable_temporal_nexus
                durable_temporal_nexus:
                    dsn: '%env(DURABLE_TEMPORAL_DSN)%'
                    options:
                        purpose: nexus_worker

when@demo_appelant:
    framework:
        messenger:
            transports:
                # Le worker de tâches de workflow du profil appelant. C'est lui qui fait avancer
                # `CommandeWorkflow` entre ses deux appels — et qui le reprend après l'attente, sans
                # que ce soit forcément le même processus qui l'avait démarré.
                durable_temporal_journal:
                    dsn: '%env(DURABLE_TEMPORAL_DSN)%'
