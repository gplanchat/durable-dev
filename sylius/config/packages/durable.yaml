# Le tableau de bord lit le backend configuré ici. DBAL plutôt que Temporal : une boutique Sylius
# n'a pas de cluster, et le pont Temporal exigerait ext-grpc — c'est précisément ce que le plugin a
# cessé d'imposer (DUR035).
durable:
    dbal:
        connection: doctrine.dbal.default_connection
        lock_factory: lock.factory
    event_store:
        type: dbal
    workflow_metadata:
        type: dbal
    child_workflow:
        parent_link_store:
            type: dbal

    # Le profil Temporal de la boutique : joignable pour servir Nexus, et rien de plus.
    #
    # `journal: false` est la ligne qui compte. Sans elle, poser un DSN veut dire « le cluster est
    # le journal » — l'extension refuse alors le couple avec un event_store DBAL, et à raison : il
    # n'y aurait pas de source de vérité unique. Avec elle, la phrase se sépare en deux, et le
    # tableau de bord ci-dessus continue de lire exactement ce qu'il lisait.
    #
    # Sans `DURABLE_TEMPORAL_DSN`, rien de tout cela n'est monté : la boutique reste ce qu'elle
    # était, et n'exige toujours pas ext-grpc.
    temporal:
        dsn: '%env(DURABLE_TEMPORAL_DSN)%'
        journal: false

# Le second profil de la boutique : celui qui **appelle**.
#
# Un appel Nexus part d'un workflow, et un workflow ne peut ordonnancer une opération que si son
# journal est le cluster : `EventStoreCommandBuffer` refuse en le disant, parce qu'un journal SQL
# n'a pas de serveur à qui adresser l'ordonnancement. Servir et appeler ne tiennent donc pas dans
# la même configuration Durable.
#
# Ce n'est pas un contournement, c'est ce à quoi ressemble un vrai déploiement : le processus qui
# rend le tableau de bord et celui qui exécute les workflows sont deux déploiements du même code,
# avec deux profils. `APP_ENV=demo` en est un.
when@demo:
    durable:
        event_store:
            type: in_memory
        workflow_metadata:
            type: in_memory
        child_workflow:
            parent_link_store:
                type: in_memory
        temporal:
            dsn: '%env(DURABLE_TEMPORAL_DSN)%'
            journal: true
