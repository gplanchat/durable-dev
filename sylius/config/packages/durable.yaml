# The dashboard reads the backend configured here. DBAL rather than Temporal: a Sylius shop has no
# cluster, and the Temporal bridge would require ext-grpc — which is exactly what the plugin
# stopped imposing (DUR037; DUR035 is `await()` and conditions, unrelated).
durable:
    dbal:
        connection: doctrine.dbal.default_connection
        lock_factory: lock.factory
    event_store:
        type: dbal
    workflow_metadata:
        type: dbal
    child_workflow:
        parent_link_store:
            type: dbal

# Two demonstration profiles, and nothing in `dev`, `prod` or `test`.
#
# This is not caution: a Messenger `temporal://` transport declared without a DSN makes
# `doctrine:schema:create` fail, Doctrine's schema listener walking **every** transport. The
# message is "Invalid temporal:// DSN", far from Nexus and far from Messenger. An environment that
# has no cluster therefore has no DSN, no transport and no handler.

# `demo` — the shop **serves** `stock`.
#
# `journal: false` is the line that counts. Without it, setting a DSN means "the cluster is the
# journal" — the extension then refuses the pairing with a DBAL event_store, and rightly so: there
# would be no single source of truth. With it, the sentence splits in two, and the dashboard goes
# on reading exactly what it was reading.
when@demo:
    durable:
        temporal:
            dsn: '%env(DURABLE_TEMPORAL_DSN)%'
            journal: false

# `demo_caller` — the shop **calls** `billing`.
#
# A Nexus call starts from a workflow, and a workflow can only schedule an operation if its
# journal is the cluster: `EventStoreCommandBuffer` refuses and says so, because an SQL journal has
# no server to address the scheduling to. Serving and calling therefore do not fit in the same
# Durable configuration.
#
# This is not a workaround, it is what a real deployment looks like: the process that renders the
# dashboard and the one that runs the workflows are two deployments of the same code.
when@demo_caller:
    durable:
        event_store:
            type: in_memory
        workflow_metadata:
            type: in_memory
        child_workflow:
            parent_link_store:
                type: in_memory
        temporal:
            dsn: '%env(DURABLE_TEMPORAL_DSN)%'
            journal: true
