# The dashboard reads the backend configured here. DBAL rather than Temporal: a Sylius shop has no
# cluster, and the Temporal bridge would require ext-grpc — which is exactly what the plugin
# stopped imposing (DUR037; DUR035 is `await()` and conditions, unrelated).
durable:
    backend: dbal
    dbal:
        connection: doctrine.dbal.default_connection
        lock_factory: lock.factory

# Activities ride the `durable_activities` transport messenger.yaml declares for these three
# environments. Left at its default, the transport would be `in_memory`, and an activity would run
# inside the workflow task that scheduled it.
when@dev: &durable_activities
    durable:
        activity_transport:
            type: messenger
            transport_name: durable_activities
when@test: *durable_activities
when@prod: *durable_activities

# Two demonstration profiles, and nothing in `dev`, `prod` or `test`: an environment that has no
# cluster has no DSN and no handler. With a DSN, the Durable bundle registers the Temporal workers
# itself — `durable_nexus` in `demo`, `durable_workflows` in `demo_caller` — and messenger.yaml
# declares none of them.

# `demo` — the shop **serves** `stock`.
#
# `backend: dbal` stays: the DSN only adds the cluster that serves the operation, and the dashboard
# goes on reading the SQL journal it was reading.
when@demo:
    durable:
        temporal:
            dsn: '%env(DURABLE_TEMPORAL_DSN)%'

# `demo_caller` — the shop **calls** `billing`.
#
# A Nexus call starts from a workflow, and a workflow can only schedule an operation if its
# journal is the cluster: `EventStoreCommandBuffer` refuses and says so, because an SQL journal has
# no server to address the scheduling to. Serving and calling therefore do not fit in the same
# Durable configuration.
#
# This is not a workaround, it is what a real deployment looks like: the process that renders the
# dashboard and the one that runs the workflows are two deployments of the same code.
when@demo_caller:
    durable:
        backend: temporal
        temporal:
            dsn: '%env(DURABLE_TEMPORAL_DSN)%'
