# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # Default configuration for services in *this* file
    _defaults:
        # Automatically injects dependencies in your services
        autowire: true

        # Automatically registers your services as commands, event subscribers, etc.
        autoconfigure: true

        # Allows optimizing the container by removing unused services; this also means
        # fetching services directly from the container via $container->get() won't work
        public: false

    _instanceof:
        Sylius\Bundle\ResourceBundle\Controller\ResourceController:
            autowire: false
        Sylius\Bundle\ResourceBundle\Form\Type\AbstractResourceType:
            autowire: false

    # Makes classes in src/ available to be used as services;
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Les workflows se déclarent par une balise et non par un attribut : c'est elle que lit
    # WorkflowPass. Sans elle, un #[AsWorkflow] est une classe que personne n'enregistre.
    App\Durable\Workflow\:
        resource: '../src/Durable/Workflow/'
        tags: [durable.workflow]

    # Controllers are imported separately to make sure services can be injected
    # as action arguments even if you don't extend any base controller class
    App\Controller\:
        resource: '../src/Controller'
        tags: ['controller.service_arguments']

# La balise Nexus est posée ici, et non par `#[AsNexusServiceHandler]` sur la classe.
#
# L'attribut vaudrait dans **tous** les environnements, et un gestionnaire déclaré sur un backend
# sans route est refusé au démarrage — à raison, puisqu'il ne recevrait jamais rien. Or la boutique
# n'a de cluster que dans son profil de démonstration. La balise dit donc ce qui est vrai : elle
# sert `stock` en `demo`, et nulle part ailleurs.
#
# `symfony/` garde l'attribut, lui : son banc a un DSN en dev comme en prod.
when@demo:
    services:
        # `autowire` explicitement : redéfinir un service dans un bloc `when@` **remplace** la
        # définition venue du chargement de `App\`, et les `_defaults` du bloc principal ne s'y
        # appliquent pas. Sans cette ligne, le constructeur ne reçoit rien.
        App\Durable\Nexus\StockHandler:
            autowire: true
            tags:
                - name: durable.nexus_handler
                  contract: 'Gplanchat\Durable\Demo\Contracts\Stock\StockServed'
