# Construit les images PHP portant `grpc` et `protobuf`, et les publie sur GHCR.
#
# **Indépendante de `ci.yml` à dessein.** Elle ne teste rien du composant : elle fabrique un
# outillage, sur son propre rythme et avec ses propres permissions. La mêler à la CI ferait payer
# une compilation C++ de plusieurs minutes à chaque pull request qui touche une ligne de PHP.
#
# **Pourquoi ces images existent, alors que la CI n'en a pas besoin.** Mesuré sur ce dépôt :
# `shivammathur/setup-php` installe `grpc` en **cinq secondes**, binaire préconstruit à l'appui —
# le job « Tests d'intégration Temporal » démarre PHP aussi vite que celui de Sylius, qui ne demande
# pas l'extension. Pour GitHub Actions, le problème est réglé et une chaîne de construction serait
# une redite.
#
# Ce qui n'est pas réglé, c'est **Docker**. Une image `php:8.3-alpine` n'a pas grpc, et
# `install-php-extensions` la compile depuis les sources à chaque construction. Des images tierces
# existent, maintenues par une personne et hors de notre contrôle. D'où celles-ci : le coût est payé
# une fois, ici, et ce qu'on consomme nous appartient.

name: Images PHP (grpc + protobuf)

on:
    workflow_dispatch:
        inputs:
            platforms:
                description: "Architectures cibles. arm64 passe par QEMU et rallonge beaucoup une compilation C++."
                default: linux/amd64
                type: choice
                options:
                    - linux/amd64
                    - linux/amd64,linux/arm64
    push:
        paths:
            - 'docker/php-grpc/**'
            - '.github/workflows/php-grpc-images.yml'
    schedule:
        # Une fois par mois : ces images embarquent les paquets système de leur base, et une image
        # figée six mois est une image qui accumule des correctifs de sécurité qu'elle n'a pas.
        - cron: '17 4 1 * *'

concurrency:
    group: php-grpc-images-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: PHP ${{ matrix.php }} · ${{ matrix.flavour }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                php: ['8.2', '8.3', '8.4']
                flavour: [cli, cli-alpine]
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-qemu-action@v3
              if: contains(inputs.platforms, 'arm64')

            - uses: docker/setup-buildx-action@v3

            - name: S'authentifier auprès de GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # `github.repository_owner` plutôt que le nom du dépôt : ces images ne sont pas celles de
            # Durable, ce sont celles de son auteur — d'autres projets peuvent les consommer.
            - name: Étiquettes
              id: meta
              run: |
                  base="ghcr.io/${{ github.repository_owner }}/php-grpc"
                  echo "tags=${base}:${{ matrix.php }}-${{ matrix.flavour }},${base}:${{ matrix.php }}-${{ matrix.flavour }}-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

            - name: Construire et publier
              uses: docker/build-push-action@v6
              with:
                  context: docker/php-grpc
                  platforms: ${{ inputs.platforms || 'linux/amd64' }}
                  build-args: |
                      PHP_VERSION=${{ matrix.php }}
                      FLAVOUR=${{ matrix.flavour }}
                  # Sur une pull request, on construit sans publier : la compilation est ce qu'on
                  # veut vérifier, la publication n'a pas à l'être.
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  cache-from: type=gha,scope=php-grpc-${{ matrix.php }}-${{ matrix.flavour }}
                  cache-to: type=gha,mode=max,scope=php-grpc-${{ matrix.php }}-${{ matrix.flavour }}

            # Le `RUN php -m | grep` du Dockerfile prouve l'extension **dans** la couche construite.
            # Celui-ci la prouve dans l'image **publiée**, ce qui n'est pas la même affirmation.
            - name: L'image publiée porte bien les deux extensions
              if: github.event_name != 'pull_request' && !contains(inputs.platforms, 'arm64')
              run: |
                  image="ghcr.io/${{ github.repository_owner }}/php-grpc:${{ matrix.php }}-${{ matrix.flavour }}"
                  docker run --rm "$image" php -m | grep -qx grpc
                  docker run --rm "$image" php -m | grep -qx protobuf
                  docker run --rm "$image" php -v | head -n 1
