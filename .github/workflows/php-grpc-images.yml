# Construit les images PHP portant `grpc` et `protobuf`, et les publie sur GHCR.
#
# **Indépendante de `ci.yml` à dessein.** Elle ne teste rien du composant : elle fabrique un
# outillage, sur son propre rythme et avec ses propres permissions. La mêler à la CI ferait payer
# une compilation C++ de plusieurs minutes à chaque pull request qui touche une ligne de PHP.
#
# **Pourquoi ces images existent, alors que la CI n'en a pas besoin.** Mesuré sur ce dépôt :
# `shivammathur/setup-php` installe `grpc` en **cinq secondes**, binaire préconstruit à l'appui —
# le job « Tests d'intégration Temporal » démarre PHP aussi vite que celui de Sylius, qui ne demande
# pas l'extension. Pour GitHub Actions, le problème est réglé et une chaîne de construction serait
# une redite.
#
# Ce qui n'est pas réglé, c'est **Docker**. Une image `php:8.3-alpine` n'a pas grpc, et
# `install-php-extensions` la compile depuis les sources à chaque construction. Des images tierces
# existent, maintenues par une personne et hors de notre contrôle. D'où celles-ci : le coût est payé
# une fois, ici, et ce qu'on consomme nous appartient.

name: Images PHP (grpc + protobuf)

on:
    workflow_dispatch:
        inputs:
            platforms:
                description: "Architectures cibles. arm64 passe par QEMU et rallonge beaucoup une compilation C++."
                default: linux/amd64
                type: choice
                options:
                    - linux/amd64
                    - linux/amd64,linux/arm64
            dry_run:
                description: "Élagage : montrer ce qui serait retiré, sans le retirer."
                default: true
                type: boolean
    # Déclenchement externe, pour qui veut rafraîchir sans passer par l'interface :
    #     gh api repos/:owner/:repo/dispatches -f event_type=php-grpc-images
    repository_dispatch:
        types: [php-grpc-images]
    push:
        # `main` seulement. Sans ce filtre, une branche de travail publie ses images sous les
        # étiquettes glissantes — `8.3-cli` finit par désigner un essai non relu.
        branches: [main]
        paths:
            - 'docker/php-grpc/**'
            - '.github/workflows/php-grpc-images.yml'
    pull_request:
        paths:
            - 'docker/php-grpc/**'
            - '.github/workflows/php-grpc-images.yml'
    schedule:
        # Toutes les semaines. Deux choses vieillissent ici et pas au même rythme : les paquets
        # système de la base, et PHP lui-même — dont les versions correctives sortent chaque mois.
        # Une cadence hebdomadaire fait que l'écart entre `php:8.4-cli` et notre image se compte en
        # jours. Le cache Buildx rend la reconstruction bon marché quand rien n'a bougé en amont.
        - cron: '17 4 * * 1'

concurrency:
    group: php-grpc-images-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: PHP ${{ matrix.php }} · ${{ matrix.flavour }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                php: ['8.2', '8.3', '8.4', '8.5']
                # `zts` est la variante compilée avec le support des threads. Elle n'est pas un
                # détail de compilation : un runtime qui exécute plusieurs workers dans un même
                # processus la réclame, et une extension chargée dans un PHP dont la thread-safety
                # ne correspond pas refuse tout simplement de se charger. Les deux sont donc
                # nécessaires, aucune ne remplace l'autre.
                flavour: [cli, cli-alpine, zts, zts-alpine]
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-qemu-action@v3
              if: contains(inputs.platforms, 'arm64')

            - uses: docker/setup-buildx-action@v3

            - name: S'authentifier auprès de GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # `github.repository_owner` plutôt que le nom du dépôt : ces images ne sont pas celles de
            # Durable, ce sont celles de son auteur — d'autres projets peuvent les consommer.
            - name: Étiquettes
              id: meta
              run: |
                  base="ghcr.io/${{ github.repository_owner }}/php-grpc"
                  echo "tags=${base}:${{ matrix.php }}-${{ matrix.flavour }},${base}:${{ matrix.php }}-${{ matrix.flavour }}-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

            - name: Construire et publier
              uses: docker/build-push-action@v6
              with:
                  context: docker/php-grpc
                  platforms: ${{ inputs.platforms || 'linux/amd64' }}
                  build-args: |
                      PHP_VERSION=${{ matrix.php }}
                      FLAVOUR=${{ matrix.flavour }}
                  # Sur une pull request, on construit sans publier : la compilation est ce qu'on
                  # veut vérifier, la publication n'a pas à l'être.
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  cache-from: type=gha,scope=php-grpc-${{ matrix.php }}-${{ matrix.flavour }}
                  cache-to: type=gha,mode=max,scope=php-grpc-${{ matrix.php }}-${{ matrix.flavour }}

            # Le `RUN php -m | grep` du Dockerfile prouve l'extension **dans** la couche construite.
            # Celui-ci la prouve dans l'image **publiée**, ce qui n'est pas la même affirmation.
            - name: L'image publiée porte bien les deux extensions
              if: github.event_name != 'pull_request' && !contains(inputs.platforms, 'arm64')
              run: |
                  image="ghcr.io/${{ github.repository_owner }}/php-grpc:${{ matrix.php }}-${{ matrix.flavour }}"
                  docker run --rm "$image" php -m | grep -qx grpc
                  docker run --rm "$image" php -m | grep -qx protobuf
                  attendu="$(case '${{ matrix.flavour }}' in zts*) echo enabled;; *) echo disabled;; esac)"
                  docker run --rm "$image" php -i | grep -q "Thread Safety => $attendu"
                  docker run --rm "$image" php -v | head -n 1

    # Seize images reconstruites chaque lundi, chacune posant une étiquette datée : environ huit
    # cents étiquettes par an, et rien ne les élague. La liste des versions devient illisible bien
    # avant que le stockage ne pose problème.
    retention:
        name: Élaguer les étiquettes datées
        needs: build
        # Jamais sur une pull request : rien n'y est publié, il n'y a donc rien à élaguer, et un job
        # qui supprime des images publiées n'a pas sa place dans la validation d'une proposition.
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # Ce qui décide tient dans une fonction, et elle est vérifiée avant d'être appliquée.
            # Le cas qui compte : le lundi de la publication, `8.4-zts` et `8.4-zts-20260828`
            # désignent le même manifeste — retirer « l'étiquette datée » retirerait l'image que
            # l'étiquette glissante désigne.
            - name: La règle se vérifie avant de s'appliquer
              run: python3 docker/php-grpc/retention.py --self-test

            - name: Élaguer
              env:
                  # L'API de suppression de paquets n'accepte pas le `GITHUB_TOKEN` : elle demande
                  # un jeton personnel classique portant `read:packages` et `delete:packages`. Sans
                  # le secret, le job avertit et s'arrête — un échec hebdomadaire finirait par être
                  # ignoré, et avec lui les vrais.
                  GH_TOKEN: ${{ secrets.GHCR_RETENTION_TOKEN }}
                  OWNER: ${{ github.repository_owner }}
                  DRY_RUN: ${{ inputs.dry_run || 'false' }}
              run: |
                  if [ -z "$GH_TOKEN" ]; then
                      echo "::warning title=Élagage non configuré::Le secret GHCR_RETENTION_TOKEN est absent. Les étiquettes datées continuent de s'accumuler. Créez un jeton personnel classique avec read:packages et delete:packages."
                      exit 0
                  fi

                  gh api --paginate "/users/$OWNER/packages/container/php-grpc/versions?per_page=100" \
                      -q '.[] | {id: .id, tags: (.metadata.container.tags // [])}' \
                      | jq -s '.' > versions.json

                  python3 docker/php-grpc/retention.py --keep 8 < versions.json > a-retirer.txt

                  if [ "$DRY_RUN" = "true" ]; then
                      echo "::notice::Essai à blanc : $(wc -l < a-retirer.txt) version(s) auraient été retirées."
                      exit 0
                  fi

                  while read -r id; do
                      gh api -X DELETE "/users/$OWNER/packages/container/php-grpc/versions/$id"
                      echo "retirée : $id"
                  done < a-retirer.txt
