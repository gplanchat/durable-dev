# Voir DUR009 (pyramide de tests), DUR008 (normes de code PHP-FIG).
name: CI

on:
    push:
        branches: [main, master]
    pull_request:

jobs:
    qa:
        name: QA (CS + tests)
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php-version: ['8.2', '8.3', '8.4', '8.5']
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  # ext-grpc : requis pour WorkflowTaskRunner, WorkflowTaskProcessor et TemporalHistoryCursor (DUR027).
                  extensions: mbstring, sqlite3, pdo_sqlite, grpc
                  coverage: none

            - name: Install Composer dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: PHP-CS-Fixer (dry-run)
              run: composer cs:check

            - name: PHPUnit
              run: composer test

    symfony-matrix:
        # Le job `qa` installe la résolution du composer.lock : il ne voit qu'une ligne Symfony.
        # Or le seul bug de compatibilité trouvé jusqu'ici — `#[\Override]` sur une méthode que
        # le DataCollector de Symfony 6.4 ne déclare pas, fatale à partir de PHP 8.3 — n'était
        # visible qu'au *croisement* d'une vieille ligne Symfony et d'un PHP récent. D'où une
        # matrice explicite plutôt qu'un produit cartésien : chaque entrée est un bord qui a une
        # raison d'exister.
        name: Symfony ${{ matrix.symfony }} / PHP ${{ matrix.php-version }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    # 6.4 LTS au plancher PHP de la bibliothèque.
                    - { php-version: '8.2', symfony: '6.4.*', deps: 'lowest' }
                    # 6.4 LTS sous un PHP récent : le croisement qui mord.
                    - { php-version: '8.4', symfony: '6.4.*', deps: 'highest' }
                    # Plancher *installable* de la ligne 7. La contrainte autorise ^7.0, mais
                    # 7.0.x à 7.3.x sont en fin de vie et bloquées par les avis de sécurité de
                    # Composer : les épingler ici ne testerait rien, ça échouerait à résoudre.
                    - { php-version: '8.2', symfony: '7.4.*', deps: 'lowest' }
                    # 7.4 LTS sous PHP récent : ce que le lock résout aujourd'hui.
                    - { php-version: '8.4', symfony: '7.4.*', deps: 'highest' }
                    # Ligne 8 : exige PHP >= 8.4, donc jamais atteignable en local sur 8.2.
                    - { php-version: '8.4', symfony: '8.0.*', deps: 'lowest' }
                    - { php-version: '8.5', symfony: '8.*', deps: 'highest' }
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  extensions: mbstring, sqlite3, pdo_sqlite, grpc
                  coverage: none

            # Flex contraint *toutes* les dépendances symfony/*, y compris transitives, sur la
            # ligne demandée. Sans lui il faudrait énumérer chaque paquet à la main, et la racine
            # du monorepo n'en requiert plus aucun directement.
            - name: Épingler la ligne Symfony (Flex)
              run: |
                  composer global config --no-plugins allow-plugins.symfony/flex true
                  composer global require --no-progress --no-scripts --no-plugins symfony/flex
                  composer config --no-plugins allow-plugins.symfony/flex true

            # Mise à jour partielle : seule la dimension Symfony bouge. Un `--prefer-lowest`
            # non filtré abaisserait aussi phpunit et phpstan, et ferait échouer la matrice sur
            # autre chose que ce qu'elle mesure.
            - name: Résoudre la ligne Symfony demandée
              env:
                  SYMFONY_REQUIRE: ${{ matrix.symfony }}
              run: |
                  composer update --no-interaction --prefer-dist --no-progress \
                    ${{ matrix.deps == 'lowest' && '--prefer-lowest' || '' }} 'symfony/*'

            - name: Ligne Symfony effectivement installée
              run: composer show symfony/messenger --no-ansi | head -n 3

            - name: PHPUnit
              run: composer test

            # PHPStan est l'outil qui avait attrapé `#[\Override]` : sans lui, la matrice ne
            # verrait le problème que si un test charge la classe fautive.
            - name: PHPStan
              run: composer phpstan

    laravel:
        # Le pendant de la matrice Symfony, pour l'autre famille d'hôtes. Même principe : une
        # entrée par *bord* qui a une raison d'exister, pas un produit cartésien.
        #
        # Ce que cette matrice mesure et qu'aucune autre ne peut : `gplanchat/durable-laravel`
        # s'appuie sur `illuminate/*`, dont les lignes 11, 12 et 13 ne demandent pas le même PHP —
        # 13 exige ^8.3 quand la baseline du dépôt est 8.2 — et dont les contrats bougent d'une
        # ligne à l'autre. La suite `unit` ne prouve que la ligne du lock.
        #
        # ⚠ Ce paquet ne requiert **pas** `illuminate/queue`, et ce n'est pas un oubli : Laravel 11+
        # en tire `symfony/process ^7.2`, ce qui le rendrait irréconciliable avec la ligne
        # Symfony 6.4 que la matrice voisine teste encore. La garde contre la file `sync` lit donc
        # le nom du driver dans la configuration plutôt que la classe de la connexion.
        name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php-version }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    # 11 au plancher PHP commun aux deux.
                    - { php-version: '8.2', laravel: '11.*', deps: 'lowest' }
                    # 11 sous un PHP récent : le croisement qui mord, comme pour Symfony 6.4.
                    - { php-version: '8.4', laravel: '11.*', deps: 'highest' }
                    # 12 au plancher.
                    - { php-version: '8.2', laravel: '12.*', deps: 'lowest' }
                    # 12 sous PHP récent : ce que le lock résout aujourd'hui.
                    - { php-version: '8.4', laravel: '12.*', deps: 'highest' }
                    # 13 exige PHP ^8.3 : jamais atteignable au plancher du dépôt.
                    - { php-version: '8.4', laravel: '13.*', deps: 'lowest' }
                    - { php-version: '8.5', laravel: '13.*', deps: 'highest' }
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  # grpc comme la matrice Symfony : la racine requiert le pont Temporal, qui exige
                  # ext-grpc. Sans elle, `composer update` échoue avant d'avoir résolu quoi que ce
                  # soit d'Illuminate — la matrice mesurerait l'absence d'une extension.
                  extensions: mbstring, sqlite3, pdo_sqlite, grpc
                  coverage: none

            # Mise à jour partielle, même raison que côté Symfony : seule la dimension Laravel
            # bouge. Un `--prefer-lowest` non filtré abaisserait phpunit et phpstan, et la matrice
            # échouerait sur autre chose que ce qu'elle mesure.
            - name: Résoudre la ligne Laravel demandée
              run: |
                  composer require --no-update --no-interaction --dev \
                    "illuminate/cache:${{ matrix.laravel }}" \
                    "illuminate/database:${{ matrix.laravel }}"
                  composer update --no-interaction --prefer-dist --no-progress \
                    ${{ matrix.deps == 'lowest' && '--prefer-lowest' || '' }} 'illuminate/*'

            - name: Ligne Laravel effectivement installée
              run: composer show illuminate/database --no-ansi | head -n 3

            - name: PHPUnit (le paquet d'intégration et le pont Illuminate)
              run: vendor/bin/phpunit --testsuite laravel

            - name: PHPStan
              run: composer phpstan

    sylius-shop:
        # La seule vérification du dépôt qui rende vraiment une page. Tout le reste prouve que les
        # pièces sont correctes ; celle-ci prouve qu'assemblées elles affichent quelque chose.
        #
        # Hors de la matrice principale, et pour deux raisons qui ne se contournent pas : Sylius
        # Standard 2.2 exige PHP ^8.3 quand la baseline du dépôt est 8.2, et la boutique a besoin
        # d'un vrai MySQL. C'est justement ce dernier qui a révélé deux fautes que SQLite avalait —
        # un booléen lié sans type, et un upsert qui comptait les lignes affectées par un UPDATE.
        name: Boutique Sylius (le tableau de bord, rendu)
        runs-on: ubuntu-latest
        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ALLOW_EMPTY_PASSWORD: 1
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=20
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  # 8.3 : plancher de Sylius Standard 2.2. Le plugin, lui, reste en >=8.2.
                  php-version: '8.3'
                  # grpc : la boutique sert une opération Nexus, et le pont Temporal en dépend.
                  # Son tableau de bord, lui, n'en a toujours pas besoin — c'est DUR037, et
                  # `temporal.journal: false` est ce qui garde les deux séparés.
                  extensions: intl, gd, pdo_mysql, mbstring, zip, curl, sodium, exif, fileinfo, grpc
                  coverage: none

            # Les paquets du dépôt entrent par des dépôts `path` : la boutique lit `../src`, donc
            # elle teste le code de ce commit et non une version publiée.
            - name: Composer install (sylius/)
              working-directory: sylius
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Base de test
              working-directory: sylius
              env:
                  APP_ENV: test
              run: |
                bin/console doctrine:database:create --if-not-exists
                bin/console doctrine:schema:create

            - name: PHPUnit — le tableau de bord est rendu
              working-directory: sylius
              env:
                  APP_ENV: test
              run: vendor/bin/phpunit tests/Functional/DurableDashboardTest.php

    magento-matrix:
        # Le pendant de la matrice Symfony, pour l'autre hôte à conteneur étranger. Même principe :
        # chaque entrée est un **bord qui a une raison**, pas un produit cartésien. Ce que le job
        # prouve est la résolution — que la contrainte du module (`php >=8.2`,
        # `magento/framework ^103.0`) est honnête face à ce que chaque ligne de Mage-OS exige. Ce
        # qu'il ne prouve pas est le démarrage : installer la distribution coûte ~1 Go et plusieurs
        # minutes par entrée, et c'est le travail du job d'intégration, pas d'une matrice.
        #
        # Le garde discrimine, vérifié en local avant d'être écrit ici : 2.2.0 sur PHP 8.2 résout
        # (code 0), 3.4.0 sur PHP 8.2 échoue en nommant la cause — « requires php ~8.3.0||~8.4.0||
        # ~8.5.0 -> your php version (8.2.33) does not satisfy that requirement ».
        name: Module Magento (Mage-OS ${{ matrix.mageos }} / PHP ${{ matrix.php-version }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    # La ligne la plus ancienne qui accepte encore le plancher PHP du module.
                    # Elle éprouve `magento/framework: ^103.0` par le bas.
                    - { php-version: '8.2', mageos: '1.3.0' }
                    # L'épingle du banc, au plancher PHP : le couple sur lequel toutes les mesures
                    # de ce change ont été faites.
                    - { php-version: '8.2', mageos: '2.2.0' }
                    # Haut de la ligne 2 sous un PHP récent.
                    - { php-version: '8.4', mageos: '2.3.0' }
                    # Le bord qui mord : Mage-OS 3 refuse PHP 8.2 alors que le module l'autorise.
                    # 8.3 est donc le plancher *atteignable* de cette ligne, pas celui du module.
                    - { php-version: '8.3', mageos: '3.4.0' }
                    # Le plus récent sur le plus récent.
                    - { php-version: '8.5', mageos: '3.4.0' }
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  # Ce que le métapaquet réclame de l'hôte ; `magento/check-php-extensions.sh` en
                  # est la liste de référence, tenue à jour par le banc.
                  extensions: bcmath, ctype, curl, dom, gd, iconv, intl, mbstring, openssl, pdo_mysql, simplexml, soap, sodium, xsl, zip
                  coverage: none

            # Un projet jetable plutôt que le banc : `magento/` porte un lock épinglé sur une seule
            # ligne, et une matrice qui le réutiliserait ne testerait qu'elle.
            - name: Projet de résolution
              run: |
                mkdir -p /tmp/resolve
                cat > /tmp/resolve/composer.json <<JSON
                {
                    "minimum-stability": "dev",
                    "prefer-stable": true,
                    "repositories": [
                        { "type": "composer", "url": "https://repo.mage-os.org/" },
                        { "type": "path", "url": "${{ github.workspace }}/src/DurableModule", "options": { "symlink": false } },
                        { "type": "path", "url": "${{ github.workspace }}/src/Durable", "options": { "symlink": false } },
                        { "type": "path", "url": "${{ github.workspace }}/src/Bridge/Temporal", "options": { "symlink": false } }
                    ],
                    "require": {
                        "mage-os/product-community-edition": "${{ matrix.mageos }}",
                        "gplanchat/durable-magento": "@dev"
                    },
                    "config": {
                        "allow-plugins": {
                            "mage-os/composer-dependency-version-audit-plugin": false,
                            "mage-os/magento-composer-installer": true,
                            "mage-os/inventory-composer-installer": true,
                            "laminas/laminas-dependency-plugin": true
                        }
                    }
                }
                JSON

            # `--dry-run` : la résolution est ce qu'on teste, le téléchargement ne l'est pas.
            # Le plugin d'audit des dépôts de chemin est désactivé pour la même raison qu'au banc —
            # `gplanchat/durable` est à la fois publié et fourni par chemin, et ici le chemin est la
            # source de vérité.
            - name: La ligne Mage-OS accepte-t-elle le module ?
              working-directory: /tmp/resolve
              run: composer update --dry-run --no-interaction --no-audit --no-progress

    magento-boot:
        # Le pendant de « Boutique Sylius » pour l'autre hôte : un seul job, non matricé, qui
        # **démarre** vraiment Magento. Il existe parce que jusqu'ici toute affirmation sur ce
        # module reposait sur un transcript produit à la main sur le banc d'un poste — et la
        # matrice Mage-OS × PHP, elle, ne prouve que la résolution.
        #
        # Il est cher : la distribution pèse ~1 Go et l'installation prend des minutes. C'est
        # justement pourquoi il n'est pas matricé — un bord, celui du banc, épinglé par le lock
        # suivi de `magento/`.
        name: Module Magento (il démarre pour de vrai)
        runs-on: ubuntu-latest
        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: magento
                    MYSQL_DATABASE: magento
                    MYSQL_USER: magento
                    MYSQL_PASSWORD: magento
                ports:
                    - 3306:3306
                # `log_bin_trust_function_creators` : sans lui l'installation meurt sur
                # « You do not have the SUPER privilege … CREATE TRIGGER ». Le banc le règle pareil.
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1"
                    --health-interval=5s --health-timeout=5s --health-retries=20
            opensearch:
                image: opensearchproject/opensearch:2.12.0
                env:
                    discovery.type: single-node
                    # Le nom que 2.12 comprend — le banc l'a réglé ainsi, et c'est le réglage
                    # dont on sait qu'il marche. `plugins.security.disabled` est ignoré ici.
                    DISABLE_SECURITY_PLUGIN: 'true'
                    OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
                ports:
                    - 9200:9200
                options: >-
                    --health-cmd="curl -sf http://localhost:9200/_cluster/health || exit 1"
                    --health-interval=10s --health-timeout=5s --health-retries=30
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  # Le plancher du banc, et celui sur lequel toutes ses mesures ont été faites.
                  php-version: '8.2'
                  extensions: bcmath, ctype, curl, dom, gd, iconv, intl, mbstring, openssl, pdo_mysql, simplexml, soap, sodium, xsl, zip
                  ini-values: memory_limit=-1
                  coverage: none

            # Sans ce cache, chaque exécution retélécharge la distribution.
            - name: Cache Composer
              uses: actions/cache@v4
              with:
                  path: ~/.composer/cache
                  key: magento-boot-${{ hashFiles('magento/composer.lock') }}
                  restore-keys: magento-boot-

            - name: MySQL accepte les déclencheurs
              run: mysql -h 127.0.0.1 -uroot -pmagento -e "SET GLOBAL log_bin_trust_function_creators = 1;"

            # Les dépôts `path` de `magento/` lisent `../src` : le banc installe **ce commit**, pas
            # une version publiée. C'est ce qui rend ce job capable de dire quelque chose du module.
            - name: Composer install (magento/)
              working-directory: magento
              run: composer install --no-interaction --prefer-dist --no-progress

            # L'analyse statique du module vit **ici**, et pas dans le job qui la porte pour les
            # autres paquets. La raison est celle qui a fait exister ce job : le module parle à des
            # classes que le dépôt n'installe pas, et la seule machine qui les a est celle qui vient
            # de payer l'installation de la distribution. L'alternative — des bouchons écrits à la
            # main pour les seize classes de Magento que le module touche — n'aurait pas fait
            # d'erreur : elle en aurait caché, parce qu'un bouchon approximatif rend l'analyse
            # d'accord avec lui-même.
            #
            # ⚠ `--ignore-platform-req=ext-grpc` : le pont Temporal exige l'extension en dur, et ce
            # job ne l'installe pas. Analyser n'en a pas besoin — les classes `Grpc\` viennent du
            # paquet Composer, et le pont n'est ici que *scanné*, jamais exécuté ni analysé.
            - name: Composer install (racine, pour les outils d'analyse)
              run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-req=ext-grpc

            - name: PHPStan (src/DurableModule, contre les vraies classes de Magento)
              run: composer phpstan-magento

            - name: Psalm (src/DurableModule, contre les vraies classes de Magento)
              run: composer psalm-magento

            # ⚠ Le squelette n'est pas au dépôt — `magento/.gitignore` n'y garde que l'overlay, et
            # le poste de développement l'avait obtenu une fois par `create-project`. Après un
            # `composer install` nu, `bin/magento` n'existe donc pas. `mage-os/magento2-base` porte
            # ces fichiers ; on les déploie comme le ferait le plugin d'installation, sans écraser
            # ce que l'overlay a déjà posé (`-n`).
            - name: Déployer le squelette Magento
              working-directory: magento
              run: |
                cp -Rn vendor/mage-os/magento2-base/. . || true
                test -f bin/magento
                chmod +x bin/magento

            - name: Installation de Magento
              working-directory: magento
              run: |
                bin/magento setup:install \
                  --base-url=http://127.0.0.1:8080/ \
                  --db-host=127.0.0.1 --db-name=magento --db-user=magento --db-password=magento \
                  --admin-firstname=Durable --admin-lastname=Ops --admin-email=durable@example.com \
                  --admin-user=durable --admin-password='Durable123!' \
                  --language=en_US --currency=USD --timezone=UTC --use-rewrites=1 \
                  --search-engine=opensearch --opensearch-host=127.0.0.1 --opensearch-port=9200 \
                  --backend-frontname=admin --no-interaction

            - name: Le module est là
              working-directory: magento
              run: |
                # Deux modules, et la distinction est le sujet : `Gplanchat_DurableModule` est le paquet
                # publié — il ne déclare aucun workflow. `Gplanchat_DurableProbe` est le module du
                # **banc**, qui porte la démonstration et les sondes, et qui n'ira jamais chez un
                # utilisateur. C'est lui qui fournit `durable:demo` à l'étape suivante.
                bin/magento module:enable Gplanchat_DurableModule Gplanchat_DurableProbe
                bin/magento setup:upgrade --keep-generated
                bin/magento module:status Gplanchat_DurableModule | tee /tmp/status.txt
                grep -q 'Module is enabled' /tmp/status.txt

            # L'assertion qui vaut le prix du job : un workflow écrit une fois tourne dans Magento,
            # et ses activités viennent des attributs de son contrat, pas de chaînes recopiées.
            - name: Un workflow tourne dedans
              working-directory: magento
              run: |
                bin/magento durable:demo ORD-4242 | tee /tmp/demo.txt
                grep -q "notify:charge:ORD-4242" /tmp/demo.txt
                grep -q "durable.demo.charge" /tmp/demo.txt

            # Sans DSN, l'écran doit **dire** pourquoi il est vide plutôt que d'avoir l'air en panne.
            - name: L'écran d'administration répond
              working-directory: magento
              run: |
                php -S 127.0.0.1:8080 -t pub/ phpserver/router.php > /tmp/httpd.log 2>&1 &
                php -r 'usleep(5000000);'
                curl -sf --max-time 120 http://127.0.0.1:8080/admin -o /tmp/login.html
                grep -qi 'Magento Admin' /tmp/login.html

    static-analysis:
        name: Analyse statique (PHPStan + Psalm)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  # grpc : le pont Temporal le requiert désormais en dur, `composer install`
                  # échoue sans lui.
                  php-version: '8.2'
                  extensions: mbstring, sqlite3, pdo_sqlite, grpc
                  coverage: none

            - name: Install Composer dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Versions outils (composer.lock)
              run: |
                composer show phpstan/phpstan --no-ansi | head -n 5
                composer show vimeo/psalm --no-ansi | head -n 5
                php vendor/bin/phpstan --version
                php vendor/bin/psalm --version

            - name: PHPStan (src/, tests/)
              run: composer phpstan

            - name: Psalm (src/, tests/)
              run: composer psalm

    symfony-sample:
        name: App exemple Symfony (composer + PHPUnit)
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php-version: ['8.2', '8.3', '8.4', '8.5']
                symfony: ['7.4.*', '8.0.*']
                # Symfony 8 exige PHP 8.4+ : pas d'entrée 8.0 sous 8.4.
                exclude:
                    - php-version: '8.2'
                      symfony: '8.0.*'
                    - php-version: '8.3'
                      symfony: '8.0.*'
        env:
            SYMFONY_REQUIRE: ${{ matrix.symfony }}
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  # ext-grpc : le pont Temporal l'exige en dur, et le leg 8.0 résout (composer update)
                  # au lieu d'installer depuis le lock — la contrainte plateforme y est donc vérifiée.
                  extensions: mbstring, sqlite3, pdo_sqlite, grpc
                  coverage: none

            # 7.4 : install, pour que le composer.lock versionné reste exercé (et scanné par Dependabot).
            # 8.0 : update, SYMFONY_REQUIRE n'agissant qu'à la résolution, hors lock.
            - name: Composer (symfony/, Symfony ${{ matrix.symfony }})
              working-directory: symfony
              run: composer ${{ matrix.symfony == '7.4.*' && 'install' || 'update' }} --no-interaction --prefer-dist --no-progress

            - name: PHPUnit (symfony/)
              working-directory: symfony
              run: composer test

    temporal-bridge:
        name: Bridge Temporal (ext-grpc + test resolver)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'
                  extensions: mbstring, sqlite3, pdo_sqlite, grpc
                  coverage: none

            - name: Install Composer dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: PHPUnit (journal history replay)
              run: vendor/bin/phpunit tests/unit/Bridge/Temporal/JournalStateResolverTest.php

            - name: PHPUnit (Temporal transport factory, ext-grpc)
              run: vendor/bin/phpunit tests/unit/Bridge/Temporal/Messenger/TemporalTransportFactoryTest.php

            - name: PHPUnit (WorkflowTaskRunner + WorkflowTaskProcessor — fiber replay, DUR027)
              run: vendor/bin/phpunit tests/unit/Bridge/Temporal/Worker/

    coverage:
        name: Couverture (PCOV)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP with PCOV
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'
                  extensions: mbstring, sqlite3, pdo_sqlite, grpc
                  coverage: pcov
                  ini-values: pcov.directory=.

            - name: Install Composer dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Rapport texte (src/)
              run: composer test:coverage

    temporal-integration:
        name: Tests d'intégration Temporal (gRPC + Temporal auto-setup)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP (ext-grpc requis)
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'
                  extensions: mbstring, sqlite3, pdo_sqlite, grpc
                  coverage: none

            - name: Installer les dépendances Composer (symfony/)
              working-directory: symfony
              run: composer install --no-interaction --prefer-dist --no-progress

            # `symfony/.env` publie la façade sur 7234, pour cohabiter avec un Temporal
            # local sur 7233. En CI il n'y a rien à côtoyer : on publie sur 7233, le port
            # que le DSN et les docblocs des tests annoncent. Sans ce pilotage, compose
            # écoutait 7234, le DSN visait 7233, et les neuf tests qui parlent au serveur
            # sautaient — le job restait vert en ne testant rien.
            - name: Démarrer PostgreSQL + Temporal (symfony/compose.yaml)
              working-directory: symfony
              env:
                  TEMPORAL_FRONTEND_PORT: '7233'
              run: docker compose up -d --wait --wait-timeout 300 database temporal

            - name: La façade répond, sinon on ne teste rien
              run: timeout 30 bash -c 'until nc -z 127.0.0.1 7233; do sleep 1; done'

            - name: PHPUnit — tests d'intégration Temporal (tout le répertoire)
              working-directory: symfony
              env:
                  DURABLE_DSN: 'temporal://127.0.0.1:7233?namespace=default&journal_task_queue=durable-journal&activity_task_queue=durable-activities&tls=0'
              run: |
                  php bin/phpunit \
                    --testdox \
                    --display-skipped \
                    tests/Integration/Temporal/

            - name: Arrêt des conteneurs
              if: always()
              working-directory: symfony
              run: docker compose down -v

    docker-compose-stack:
        name: Stack Docker (Temporal + UI)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Valider compose.yaml
              run: docker compose -f symfony/compose.yaml config --quiet

            - name: Démarrer PostgreSQL + Temporal + UI
              run: docker compose -f symfony/compose.yaml up -d --wait --wait-timeout 180 database temporal temporal-ui

            - name: Vérifier Temporal UI (exec interne)
              run: |
                  set -e
                  for i in $(seq 1 20); do
                    if docker compose -f symfony/compose.yaml exec -T temporal-ui wget -qO- http://localhost:8080/ > /dev/null 2>&1; then
                      echo "Temporal UI OK (tentative $i)"
                      exit 0
                    fi
                    sleep 5
                  done
                  docker compose -f symfony/compose.yaml logs temporal-ui --tail 40
                  exit 1

            - name: Arrêt des conteneurs
              if: always()
              run: docker compose -f symfony/compose.yaml down -v
