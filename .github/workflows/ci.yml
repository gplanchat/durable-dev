# Voir DUR009 (pyramide de tests), DUR008 (normes de code PHP-FIG).
name: CI

on:
    push:
        branches: [main, master]
    pull_request:

jobs:
    qa:
        name: QA (CS + tests)
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php-version: ['8.2', '8.3', '8.4', '8.5']
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  # ext-grpc : requis pour WorkflowTaskRunner, WorkflowTaskProcessor et TemporalHistoryCursor (DUR027).
                  extensions: mbstring, sqlite3, pdo_sqlite, grpc
                  coverage: none

            - name: Install Composer dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: PHP-CS-Fixer (dry-run)
              run: composer cs:check

            - name: PHPUnit
              run: composer test

    symfony-matrix:
        # Le job `qa` installe la résolution du composer.lock : il ne voit qu'une ligne Symfony.
        # Or le seul bug de compatibilité trouvé jusqu'ici — `#[\Override]` sur une méthode que
        # le DataCollector de Symfony 6.4 ne déclare pas, fatale à partir de PHP 8.3 — n'était
        # visible qu'au *croisement* d'une vieille ligne Symfony et d'un PHP récent. D'où une
        # matrice explicite plutôt qu'un produit cartésien : chaque entrée est un bord qui a une
        # raison d'exister.
        name: Symfony ${{ matrix.symfony }} / PHP ${{ matrix.php-version }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    # 6.4 LTS au plancher PHP de la bibliothèque.
                    - { php-version: '8.2', symfony: '6.4.*', deps: 'lowest' }
                    # 6.4 LTS sous un PHP récent : le croisement qui mord.
                    - { php-version: '8.4', symfony: '6.4.*', deps: 'highest' }
                    # Plancher *installable* de la ligne 7. La contrainte autorise ^7.0, mais
                    # 7.0.x à 7.3.x sont en fin de vie et bloquées par les avis de sécurité de
                    # Composer : les épingler ici ne testerait rien, ça échouerait à résoudre.
                    - { php-version: '8.2', symfony: '7.4.*', deps: 'lowest' }
                    # 7.4 LTS sous PHP récent : ce que le lock résout aujourd'hui.
                    - { php-version: '8.4', symfony: '7.4.*', deps: 'highest' }
                    # Ligne 8 : exige PHP >= 8.4, donc jamais atteignable en local sur 8.2.
                    - { php-version: '8.4', symfony: '8.0.*', deps: 'lowest' }
                    - { php-version: '8.5', symfony: '8.*', deps: 'highest' }
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  extensions: mbstring, sqlite3, pdo_sqlite, grpc
                  coverage: none

            # Flex contraint *toutes* les dépendances symfony/*, y compris transitives, sur la
            # ligne demandée. Sans lui il faudrait énumérer chaque paquet à la main, et la racine
            # du monorepo n'en requiert plus aucun directement.
            - name: Épingler la ligne Symfony (Flex)
              run: |
                  composer global config --no-plugins allow-plugins.symfony/flex true
                  composer global require --no-progress --no-scripts --no-plugins symfony/flex
                  composer config --no-plugins allow-plugins.symfony/flex true

            # Mise à jour partielle : seule la dimension Symfony bouge. Un `--prefer-lowest`
            # non filtré abaisserait aussi phpunit et phpstan, et ferait échouer la matrice sur
            # autre chose que ce qu'elle mesure.
            - name: Résoudre la ligne Symfony demandée
              env:
                  SYMFONY_REQUIRE: ${{ matrix.symfony }}
              run: |
                  composer update --no-interaction --prefer-dist --no-progress \
                    ${{ matrix.deps == 'lowest' && '--prefer-lowest' || '' }} 'symfony/*'

            - name: Ligne Symfony effectivement installée
              run: composer show symfony/messenger --no-ansi | head -n 3

            - name: PHPUnit
              run: composer test

            # PHPStan est l'outil qui avait attrapé `#[\Override]` : sans lui, la matrice ne
            # verrait le problème que si un test charge la classe fautive.
            - name: PHPStan
              run: composer phpstan

    static-analysis:
        name: Analyse statique (PHPStan + Psalm)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  # grpc : le pont Temporal le requiert désormais en dur, `composer install`
                  # échoue sans lui.
                  php-version: '8.2'
                  extensions: mbstring, sqlite3, pdo_sqlite, grpc
                  coverage: none

            - name: Install Composer dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Versions outils (composer.lock)
              run: |
                composer show phpstan/phpstan --no-ansi | head -n 5
                composer show vimeo/psalm --no-ansi | head -n 5
                php vendor/bin/phpstan --version
                php vendor/bin/psalm --version

            - name: PHPStan (src/, tests/)
              run: composer phpstan

            - name: Psalm (src/, tests/)
              run: composer psalm

    symfony-sample:
        name: App exemple Symfony (composer + PHPUnit)
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php-version: ['8.2', '8.3', '8.4', '8.5']
                symfony: ['7.4.*', '8.0.*']
                # Symfony 8 exige PHP 8.4+ : pas d'entrée 8.0 sous 8.4.
                exclude:
                    - php-version: '8.2'
                      symfony: '8.0.*'
                    - php-version: '8.3'
                      symfony: '8.0.*'
        env:
            SYMFONY_REQUIRE: ${{ matrix.symfony }}
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  # ext-grpc : le pont Temporal l'exige en dur, et le leg 8.0 résout (composer update)
                  # au lieu d'installer depuis le lock — la contrainte plateforme y est donc vérifiée.
                  extensions: mbstring, sqlite3, pdo_sqlite, grpc
                  coverage: none

            # 7.4 : install, pour que le composer.lock versionné reste exercé (et scanné par Dependabot).
            # 8.0 : update, SYMFONY_REQUIRE n'agissant qu'à la résolution, hors lock.
            - name: Composer (symfony/, Symfony ${{ matrix.symfony }})
              working-directory: symfony
              run: composer ${{ matrix.symfony == '7.4.*' && 'install' || 'update' }} --no-interaction --prefer-dist --no-progress

            - name: PHPUnit (symfony/)
              working-directory: symfony
              run: composer test

    temporal-bridge:
        name: Bridge Temporal (ext-grpc + test resolver)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'
                  extensions: mbstring, sqlite3, pdo_sqlite, grpc
                  coverage: none

            - name: Install Composer dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: PHPUnit (journal history replay)
              run: vendor/bin/phpunit tests/unit/Bridge/Temporal/JournalStateResolverTest.php

            - name: PHPUnit (Temporal transport factory, ext-grpc)
              run: vendor/bin/phpunit tests/unit/Bridge/Temporal/Messenger/TemporalTransportFactoryTest.php

            - name: PHPUnit (WorkflowTaskRunner + WorkflowTaskProcessor — fiber replay, DUR027)
              run: vendor/bin/phpunit tests/unit/Bridge/Temporal/Worker/

    coverage:
        name: Couverture (PCOV)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP with PCOV
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'
                  extensions: mbstring, sqlite3, pdo_sqlite, grpc
                  coverage: pcov
                  ini-values: pcov.directory=.

            - name: Install Composer dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Rapport texte (src/)
              run: composer test:coverage

    temporal-integration:
        name: Tests d'intégration Temporal (gRPC + Temporal auto-setup)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP (ext-grpc requis)
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'
                  extensions: mbstring, sqlite3, pdo_sqlite, grpc
                  coverage: none

            - name: Installer les dépendances Composer (symfony/)
              working-directory: symfony
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Démarrer PostgreSQL + Temporal (symfony/compose.yaml)
              working-directory: symfony
              run: docker compose up -d --wait --wait-timeout 300 database temporal

            - name: PHPUnit — tests d'intégration Temporal (temporal-integration + temporal-native-spike)
              working-directory: symfony
              env:
                  DURABLE_DSN: 'temporal://127.0.0.1:7233?namespace=default&journal_task_queue=durable-journal&activity_task_queue=durable-activities&tls=0'
              run: |
                  php bin/phpunit \
                    --group temporal-integration \
                    --group temporal-native-spike \
                    --testdox \
                    tests/Integration/Temporal/

            - name: Arrêt des conteneurs
              if: always()
              working-directory: symfony
              run: docker compose down -v

    docker-compose-stack:
        name: Stack Docker (Temporal + UI)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Valider compose.yaml
              run: docker compose -f symfony/compose.yaml config --quiet

            - name: Démarrer PostgreSQL + Temporal + UI
              run: docker compose -f symfony/compose.yaml up -d --wait --wait-timeout 180 database temporal temporal-ui

            - name: Vérifier Temporal UI (exec interne)
              run: |
                  set -e
                  for i in $(seq 1 20); do
                    if docker compose -f symfony/compose.yaml exec -T temporal-ui wget -qO- http://localhost:8080/ > /dev/null 2>&1; then
                      echo "Temporal UI OK (tentative $i)"
                      exit 0
                    fi
                    sleep 5
                  done
                  docker compose -f symfony/compose.yaml logs temporal-ui --tail 40
                  exit 1

            - name: Arrêt des conteneurs
              if: always()
              run: docker compose -f symfony/compose.yaml down -v
