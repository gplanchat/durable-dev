<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .frame { fill: #fff; stroke: #cbd5e1; stroke-width: 2.5; rx: 18; }
      .step { fill: #ecfeff; stroke: #0891b2; stroke-width: 2.5; rx: 14; }
      .comp { fill: #fff1f2; stroke: #e11d48; stroke-width: 2.5; rx: 14; }
      .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2.5; rx: 14; }
      .title { font: 700 44px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 23px Arial, sans-serif; fill: #334155; }
      .arrow { stroke: #334155; stroke-width: 2.8; fill: none; marker-end: url(#arr); }
      .arrow-red { stroke: #e11d48; stroke-width: 2.8; fill: none; marker-end: url(#arrRed); }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e11d48"/></marker>
  </defs>
  <rect width="1080" height="1080" class="bg"/>
  <rect x="36" y="36" width="1008" height="1008" class="frame"/>
  <text x="80" y="124" class="title">Saga visuelle</text>
  <text x="80" y="166" class="subtitle">Flux nominal en haut, compensation en bas.</text>

  <rect x="110" y="260" width="180" height="90" class="step"/>
  <rect x="330" y="260" width="180" height="90" class="step"/>
  <rect x="550" y="260" width="180" height="90" class="step"/>
  <rect x="770" y="260" width="180" height="90" class="step"/>
  <path d="M290,305 L330,305" class="arrow"/>
  <path d="M510,305 L550,305" class="arrow"/>
  <path d="M730,305 L770,305" class="arrow"/>

  <rect x="430" y="430" width="220" height="90" class="decision"/>
  <path d="M650,520 L800,620" class="arrow-red"/>

  <rect x="720" y="620" width="230" height="90" class="comp"/>
  <rect x="450" y="620" width="230" height="90" class="comp"/>
  <rect x="180" y="620" width="230" height="90" class="comp"/>
  <path d="M720,665 L680,665" class="arrow-red"/>
  <path d="M450,665 L410,665" class="arrow-red"/>

  <rect x="120" y="790" width="840" height="120" class="step"/>
  <text x="80" y="1000" class="subtitle">Slide 5/5 - Proposition B</text>
</svg>
