<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .frame { fill: #fff; stroke: #cbd5e1; stroke-width: 2.5; rx: 18; }
      .title { font: 700 44px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 23px Arial, sans-serif; fill: #334155; }
      .node { fill: #fff; stroke: #475569; stroke-width: 2.2; rx: 12; }
      .warn { fill: #fff7ed; stroke: #d97706; stroke-width: 2.2; rx: 12; }
      .arrow { stroke: #334155; stroke-width: 2.8; fill: none; marker-end: url(#arr); }
      .danger { stroke: #ef4444; stroke-width: 3; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1080" height="1080" class="bg"/>
  <rect x="36" y="36" width="1008" height="1008" class="frame"/>
  <text x="80" y="124" class="title">Avant: orchestration diffuse</text>
  <text x="80" y="166" class="subtitle">Beaucoup de liens implicites, peu de vision globale.</text>

  <rect x="130" y="260" width="180" height="90" class="node"/>
  <rect x="370" y="260" width="180" height="90" class="node"/>
  <rect x="610" y="260" width="180" height="90" class="node"/>
  <rect x="850" y="260" width="120" height="90" class="node"/>
  <rect x="250" y="430" width="180" height="90" class="node"/>
  <rect x="500" y="430" width="180" height="90" class="node"/>
  <rect x="750" y="430" width="180" height="90" class="node"/>

  <path d="M310,305 L370,305" class="arrow"/>
  <path d="M550,305 L610,305" class="arrow"/>
  <path d="M790,305 L850,305" class="arrow"/>
  <path d="M340,350 L340,430" class="arrow"/>
  <path d="M680,350 L590,430" class="arrow"/>
  <path d="M910,350 L840,430" class="arrow"/>
  <path d="M590,520 L250,305" class="arrow"/>

  <line x1="180" y1="570" x2="900" y2="570" class="danger"/>
  <rect x="130" y="640" width="270" height="90" class="warn"/>
  <rect x="420" y="640" width="270" height="90" class="warn"/>
  <rect x="710" y="640" width="250" height="90" class="warn"/>

  <text x="80" y="1000" class="subtitle">Slide 1/5 - Proposition B</text>
</svg>
