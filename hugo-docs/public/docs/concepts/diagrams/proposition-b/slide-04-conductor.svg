  <rect x="150" y="240" width="780" height="140" class="workflow"/>
  <rect x="220" y="430" width="640" height="190" rx="95" class="bus"/>
  <rect x="120" y="700" width="190" height="120" class="node"/>
  <rect x="330" y="700" width="190" height="120" class="node"/>
  <rect x="540" y="700" width="190" height="120" class="node"/>
  <rect x="750" y="700" width="190" height="120" class="node"/>

  <path d="M240,380 L240,430" class="arrow"/>
  <path d="M410,380 L410,430" class="arrow"/>
  <path d="M580,380 L580,430" class="arrow"/>
  <path d="M750,380 L750,430" class="arrow"/>
  <path d="M215,620 L215,700" class="arrow"/>
  <path d="M425,620 L425,700" class="arrow"/>
  <path d="M635,620 L635,700" class="arrow"/>
  <path d="M845,620 L845,700" class="arrow"/>

  <text x="80" y="1000" class="subtitle">Slide 4/5 - Proposition B</text>
