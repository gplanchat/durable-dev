<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <style>
      .title { font: 700 24px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 600 16px Arial, sans-serif; fill: #1f2937; }
      .label { font: 14px Arial, sans-serif; fill: #111827; }
      .small { font: 12px Arial, sans-serif; fill: #374151; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 8; }
      .box-warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 8; }
      .box-ok { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 8; }
      .lane { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 10; }
      .arrow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#mArrow); }
      .arrow-ok { stroke: #0891b2; stroke-width: 2.5; fill: none; marker-end: url(#mArrow); }
      .arrow-warn { stroke: #ea580c; stroke-width: 2.5; fill: none; marker-end: url(#mArrow); }
    </style>
    <marker id="mArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <text x="40" y="42" class="title">Why Durable on top of Symfony Messenger</text>
  <text x="40" y="70" class="small">Messenger moves messages. Durable execution orchestrates long-running business flow with replay, state and recovery.</text>

  <rect x="40" y="100" width="540" height="610" class="lane"/>
  <text x="60" y="132" class="subtitle">A) Classic messaging only</text>

  <rect x="70" y="160" width="210" height="60" class="box"/>
  <text x="90" y="196" class="label">HTTP Request</text>

  <rect x="350" y="160" width="200" height="60" class="box"/>
  <text x="375" y="196" class="label">Message Bus</text>

  <rect x="70" y="280" width="210" height="60" class="box"/>
  <text x="88" y="316" class="label">Handler Step 1</text>

  <rect x="350" y="280" width="200" height="60" class="box"/>
  <text x="375" y="316" class="label">$bus-&gt;dispatch(...)</text>

  <rect x="70" y="400" width="210" height="60" class="box"/>
  <text x="88" y="436" class="label">Handler Step 2</text>

  <rect x="350" y="400" width="200" height="60" class="box-warn"/>
  <text x="372" y="430" class="label">Custom state</text>
  <text x="390" y="447" class="small">(tables, flags)</text>

  <rect x="70" y="520" width="480" height="150" class="box-warn"/>
  <text x="92" y="555" class="label">Common pain points</text>
  <text x="92" y="582" class="small">- Process state spread across handlers</text>
  <text x="92" y="604" class="small">- Recovery logic hand-written per case</text>
  <text x="92" y="626" class="small">- Hard to answer: "where is my process now?"</text>
  <text x="92" y="648" class="small">- Retry and compensation often ad hoc</text>

  <path d="M280,190 L350,190" class="arrow"/>
  <path d="M175,220 L175,280" class="arrow"/>
  <path d="M280,310 L350,310" class="arrow"/>
  <path d="M175,340 L175,400" class="arrow"/>
  <path d="M280,430 L350,430" class="arrow-warn"/>

  <rect x="620" y="100" width="540" height="610" class="lane"/>
  <text x="640" y="132" class="subtitle">B) Durable execution + Messenger</text>

  <rect x="650" y="160" width="210" height="60" class="box"/>
  <text x="670" y="196" class="label">HTTP Request</text>

  <rect x="930" y="160" width="200" height="60" class="box"/>
  <text x="960" y="196" class="label">Message Bus</text>

  <rect x="650" y="280" width="210" height="60" class="box-ok"/>
  <text x="667" y="316" class="label">Durable Workflow</text>

  <rect x="930" y="280" width="200" height="60" class="box-ok"/>
  <text x="954" y="316" class="label">Activity Workers</text>

  <rect x="650" y="400" width="210" height="60" class="box-ok"/>
  <text x="688" y="435" class="label">History</text>

  <rect x="930" y="400" width="200" height="60" class="box-ok"/>
  <text x="957" y="430" class="label">Replay + Resume</text>
  <text x="991" y="447" class="small">after crash</text>

  <rect x="650" y="520" width="480" height="150" class="box-ok"/>
  <text x="672" y="555" class="label">What Durable adds</text>
  <text x="672" y="582" class="small">- Orchestration state is explicit and durable</text>
  <text x="672" y="604" class="small">- Same workflow code survives restart/deploy</text>
  <text x="672" y="626" class="small">- Native timers, signals, updates, retries</text>
  <text x="672" y="648" class="small">- Better operational visibility of each execution</text>

  <path d="M860,190 L930,190" class="arrow"/>
  <path d="M755,220 L755,280" class="arrow-ok"/>
  <path d="M860,310 L930,310" class="arrow-ok"/>
  <path d="M755,340 L755,400" class="arrow-ok"/>
  <path d="M860,430 L930,430" class="arrow-ok"/>
</svg>
