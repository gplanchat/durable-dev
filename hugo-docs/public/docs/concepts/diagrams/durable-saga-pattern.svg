<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <style>
      .title { font: 700 24px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 600 16px Arial, sans-serif; fill: #1f2937; }
      .label { font: 14px Arial, sans-serif; fill: #111827; }
      .small { font: 12px Arial, sans-serif; fill: #374151; }
      .lane { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 10; }
      .step { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 8; }
      .comp { fill: #fff1f2; stroke: #e11d48; stroke-width: 2; rx: 8; }
      .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; rx: 8; }
      .arrow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#mArrow); }
      .arrow-comp { stroke: #e11d48; stroke-width: 2.5; fill: none; marker-end: url(#mArrowRed); }
      .arrow-dash { stroke: #334155; stroke-width: 2.2; stroke-dasharray: 7 6; fill: none; marker-end: url(#mArrow); }
    </style>
    <marker id="mArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="mArrowRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e11d48"/>
    </marker>
  </defs>

  <text x="40" y="42" class="title">Saga orchestration with Durable workflows</text>
  <text x="40" y="70" class="small">When a later step fails, compensations run in reverse order to restore consistency.</text>

  <rect x="40" y="100" width="1120" height="620" class="lane"/>

  <text x="80" y="150" class="subtitle">Forward path (business success)</text>

  <rect x="80" y="180" width="210" height="65" class="step"/>
  <text x="112" y="217" class="label">1) Reserve stock</text>

  <rect x="340" y="180" width="210" height="65" class="step"/>
  <text x="370" y="217" class="label">2) Charge payment</text>

  <rect x="600" y="180" width="210" height="65" class="step"/>
  <text x="636" y="217" class="label">3) Book shipping</text>

  <rect x="860" y="180" width="210" height="65" class="step"/>
  <text x="906" y="217" class="label">4) Confirm order</text>

  <path d="M290,212 L340,212" class="arrow"/>
  <path d="M550,212 L600,212" class="arrow"/>
  <path d="M810,212 L860,212" class="arrow"/>

  <rect x="500" y="305" width="220" height="75" class="decision"/>
  <text x="545" y="336" class="label">Step 3 failed?</text>
  <text x="530" y="356" class="small">timeout, business error, etc.</text>

  <path d="M705,245 L610,305" class="arrow-dash"/>

  <text x="390" y="420" class="subtitle">Compensation path (reverse order)</text>

  <rect x="760" y="450" width="250" height="65" class="comp"/>
  <text x="790" y="487" class="label">Compensate payment</text>

  <rect x="430" y="450" width="250" height="65" class="comp"/>
  <text x="458" y="487" class="label">Release stock</text>

  <rect x="120" y="450" width="230" height="65" class="comp"/>
  <text x="145" y="487" class="label">Emit failure event</text>

  <path d="M610,380 L885,450" class="arrow-comp"/>
  <path d="M760,482 L680,482" class="arrow-comp"/>
  <path d="M430,482 L350,482" class="arrow-comp"/>

  <rect x="380" y="600" width="440" height="80" class="step"/>
  <text x="420" y="632" class="label">Saga guarantees a deterministic process trail</text>
  <text x="435" y="654" class="small">history + replay + explicit compensation logic</text>
</svg>
