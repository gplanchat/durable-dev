<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .frame { fill: #fff; stroke: #cbd5e1; stroke-width: 2.5; rx: 18; }
      .title { font: 700 44px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 23px Arial, sans-serif; fill: #334155; }
      .actor { font: 700 19px Arial, sans-serif; fill: #0f172a; }
      .lifeline { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 8; }
      .arrow { stroke: #334155; stroke-width: 2.8; fill: none; marker-end: url(#arr); }
      .reply { stroke: #64748b; stroke-width: 2.2; fill: none; marker-end: url(#arrLight); stroke-dasharray: 7 6; }
      .bus { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2.5; rx: 14; }
      .handler { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.2; rx: 12; }
      .note { fill: #fff7ed; stroke: #d97706; stroke-width: 2; rx: 10; }
      .small { font: 600 16px Arial, sans-serif; fill: #334155; }
      .foot { font: 500 20px Arial, sans-serif; fill: #64748b; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrLight" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1080" height="1080" class="bg"/>
  <rect x="36" y="36" width="1008" height="1008" class="frame"/>
  <text x="80" y="122" class="title">Sequence - Messenger seul</text>
  <text x="80" y="165" class="subtitle">Le handler orchestre implicitement via dispatch en cascade.</text>

  <text x="120" y="245" class="actor">Client</text>
  <text x="360" y="245" class="actor">Bus Messenger</text>
  <text x="650" y="245" class="actor">Handler A</text>
  <text x="890" y="245" class="actor">Handler B</text>

  <rect x="315" y="265" width="140" height="44" class="bus"/>
  <rect x="610" y="265" width="130" height="44" class="handler"/>
  <rect x="850" y="265" width="130" height="44" class="handler"/>

  <line x1="150" y1="320" x2="150" y2="900" class="lifeline"/>
  <line x1="385" y1="320" x2="385" y2="900" class="lifeline"/>
  <line x1="675" y1="320" x2="675" y2="900" class="lifeline"/>
  <line x1="915" y1="320" x2="915" y2="900" class="lifeline"/>

  <path d="M160,370 L375,370" class="arrow"/>
  <path d="M395,430 L665,430" class="arrow"/>
  <path d="M685,500 L905,500" class="arrow"/>
  <path d="M925,570 L395,570" class="arrow"/>
  <path d="M395,640 L665,640" class="arrow"/>
  <path d="M675,710 L395,710" class="reply"/>
  <path d="M385,780 L160,780" class="reply"/>

  <rect x="120" y="840" width="840" height="90" class="note"/>
  <text x="150" y="895" class="small">Le flot metier est distribue dans les handlers, difficile a suivre globalement.</text>

  <text x="80" y="1000" class="foot">Slide 1/6 - Proposition A</text>
</svg>
