<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .frame { fill: #fff; stroke: #cbd5e1; stroke-width: 2.5; rx: 18; }
      .title { font: 700 44px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 23px Arial, sans-serif; fill: #334155; }
      .actor { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .lifeline { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 8; }
      .arrow { stroke: #334155; stroke-width: 2.8; fill: none; marker-end: url(#arr); }
      .reply { stroke: #64748b; stroke-width: 2.2; fill: none; marker-end: url(#arrLight); stroke-dasharray: 7 6; }
      .workflow { fill: #cffafe; stroke: #0891b2; stroke-width: 2.5; rx: 14; }
      .bus { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2.5; rx: 14; }
      .handler { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.2; rx: 12; }
      .note { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 10; }
      .small { font: 600 16px Arial, sans-serif; fill: #334155; }
      .foot { font: 500 20px Arial, sans-serif; fill: #64748b; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrLight" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1080" height="1080" class="bg"/>
  <rect x="36" y="36" width="1008" height="1008" class="frame"/>
  <text x="80" y="122" class="title">Sequence - Messenger + Durable</text>
  <text x="80" y="165" class="subtitle">Le workflow orchestre, le bus distribue, les handlers executent.</text>

  <text x="90" y="245" class="actor">Client</text>
  <text x="250" y="245" class="actor">Workflow Durable</text>
  <text x="500" y="245" class="actor">Bus Messenger</text>
  <text x="725" y="245" class="actor">Handler A</text>
  <text x="920" y="245" class="actor">Handler B</text>

  <rect x="205" y="265" width="170" height="44" class="workflow"/>
  <rect x="455" y="265" width="140" height="44" class="bus"/>
  <rect x="690" y="265" width="120" height="44" class="handler"/>
  <rect x="885" y="265" width="120" height="44" class="handler"/>

  <line x1="120" y1="320" x2="120" y2="900" class="lifeline"/>
  <line x1="290" y1="320" x2="290" y2="900" class="lifeline"/>
  <line x1="525" y1="320" x2="525" y2="900" class="lifeline"/>
  <line x1="750" y1="320" x2="750" y2="900" class="lifeline"/>
  <line x1="945" y1="320" x2="945" y2="900" class="lifeline"/>

  <path d="M130,370 L280,370" class="arrow"/>
  <path d="M300,430 L515,430" class="arrow"/>
  <path d="M535,490 L740,490" class="arrow"/>
  <path d="M760,560 L935,560" class="arrow"/>
  <path d="M945,630 L535,630" class="reply"/>
  <path d="M525,700 L300,700" class="reply"/>
  <path d="M290,770 L130,770" class="reply"/>

  <rect x="120" y="840" width="840" height="90" class="note"/>
  <text x="150" y="895" class="small">Le workflow conserve l etat et la sequence metier: orchestration explicite.</text>

  <text x="80" y="1000" class="foot">Slide 2/6 - Proposition A</text>
</svg>
