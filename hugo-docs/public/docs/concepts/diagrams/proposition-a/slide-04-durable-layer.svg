<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .frame { fill: #fff; stroke: #cbd5e1; stroke-width: 2.5; rx: 18; }
      .workflow { fill: #ecfeff; stroke: #0891b2; stroke-width: 2.5; rx: 16; }
      .bus { fill: #e0f2fe; stroke: #0284c7; stroke-width: 3; }
      .task { fill: #fff; stroke: #475569; stroke-width: 2.2; rx: 12; }
      .title { font: 700 44px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 23px Arial, sans-serif; fill: #334155; }
      .label { font: 700 22px Arial, sans-serif; fill: #0f172a; }
      .arrow { stroke: #334155; stroke-width: 2.8; fill: none; marker-end: url(#arr); }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1080" height="1080" class="bg"/>
  <rect x="36" y="36" width="1008" height="1008" class="frame"/>
  <text x="80" y="124" class="title">Durable pilote, Messenger execute</text>
  <text x="80" y="166" class="subtitle">Orchestration en haut, bus global au centre, traitements en bas.</text>

  <rect x="140" y="240" width="800" height="150" class="workflow"/>
  <text x="420" y="325" class="label">Workflow durable</text>

  <rect x="220" y="430" width="640" height="190" rx="95" class="bus"/>
  <text x="510" y="535" class="label">BUS</text>

  <rect x="110" y="700" width="190" height="120" class="task"/><text x="170" y="770" class="subtitle">A</text>
  <rect x="330" y="700" width="190" height="120" class="task"/><text x="390" y="770" class="subtitle">B</text>
  <rect x="550" y="700" width="190" height="120" class="task"/><text x="610" y="770" class="subtitle">C</text>
  <rect x="770" y="700" width="190" height="120" class="task"/><text x="830" y="770" class="subtitle">D</text>

  <path d="M250,390 L250,430" class="arrow"/>
  <path d="M430,390 L430,430" class="arrow"/>
  <path d="M610,390 L610,430" class="arrow"/>
  <path d="M790,390 L790,430" class="arrow"/>

  <path d="M205,620 L205,700" class="arrow"/>
  <path d="M425,620 L425,700" class="arrow"/>
  <path d="M645,620 L645,700" class="arrow"/>
  <path d="M865,620 L865,700" class="arrow"/>

  <text x="80" y="1000" class="subtitle">Slide 5/6 - Proposition A</text>
</svg>
