  <path d="M190,552 L320,520" class="arrow-in"/>
  <path d="M190,662 L320,570" class="arrow-in"/>
  <path d="M190,772 L320,620" class="arrow-in"/>

  <rect x="320" y="300" width="440" height="500" rx="220" class="bus"/>
  <text x="505" y="842" class="note" text-anchor="middle">BUS</text>
  <use href="#env" x="410" y="390"/><use href="#env" x="535" y="390"/>
  <use href="#env" x="472" y="510"/><use href="#env" x="380" y="620"/><use href="#env" x="565" y="620"/>

