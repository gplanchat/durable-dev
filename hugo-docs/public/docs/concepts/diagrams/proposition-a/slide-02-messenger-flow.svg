<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .frame { fill: #fff; stroke: #cbd5e1; stroke-width: 2.5; rx: 18; }
      .title { font: 700 44px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 23px Arial, sans-serif; fill: #334155; }
      .note { font: 600 20px Arial, sans-serif; fill: #0f172a; }
      .bus { fill: #e0f2fe; stroke: #0284c7; stroke-width: 3; }
      .arrow-in { stroke: #475569; stroke-width: 2.8; fill: none; marker-end: url(#arr); }
      .arrow-out { stroke: #1d4ed8; stroke-width: 2.8; fill: none; marker-end: url(#arrBlue); }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1d4ed8"/></marker>
    <g id="env">
      <rect x="0" y="0" width="100" height="64" rx="10" fill="#fff" stroke="#0f172a" stroke-width="2.2"/>
      <polyline points="6,8 50,34 94,8" fill="none" stroke="#0f172a" stroke-width="2.2"/>
    </g>
    <g id="gear">
      <circle cx="0" cy="0" r="28" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.3"/>
      <circle cx="0" cy="0" r="10" fill="#fff" stroke="#1d4ed8" stroke-width="2"/>
      <rect x="-4" y="-43" width="8" height="13" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.6"/>
      <rect x="-4" y="30" width="8" height="13" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.6"/>
      <rect x="-43" y="-4" width="13" height="8" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.6"/>
      <rect x="30" y="-4" width="13" height="8" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.6"/>
    </g>
  </defs>
  <rect width="1080" height="1080" class="bg"/>
  <rect x="36" y="36" width="1008" height="1008" class="frame"/>
  <text x="80" y="124" class="title">Le bus comme recipient global</text>
  <text x="80" y="166" class="subtitle">Les messages entrent dans le bus. Les handlers consomment depuis le bus.</text>

  <use href="#env" x="90" y="300"/><use href="#env" x="90" y="410"/><use href="#env" x="90" y="520"/><use href="#env" x="90" y="630"/><use href="#env" x="90" y="740"/>
  <path d="M190,332 L320,420" class="arrow-in"/>
