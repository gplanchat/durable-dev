  <rect x="470" y="440" width="170" height="80" class="node"/><text x="512" y="488" class="nlabel">H5</text>

  <path d="M310,310 L360,310" class="arrow"/>
  <path d="M530,310 L580,310" class="arrow"/>
  <path d="M750,310 L800,310" class="arrow"/>
  <path d="M885,350 L615,440" class="arrow"/>
  <path d="M470,480 L225,350" class="arrow"/>
  <path d="M225,350 L840,440" class="arrow"/>

  <line x1="190" y1="560" x2="910" y2="560" class="danger"/>
  <line x1="910" y1="560" x2="870" y2="540" class="danger"/>
  <line x1="910" y1="560" x2="870" y2="580" class="danger"/>

  <rect x="130" y="650" width="260" height="70" class="chip"/><text x="165" y="693" class="chiptxt">etat disperse</text>
  <rect x="410" y="650" width="260" height="70" class="chip"/><text x="445" y="693" class="chiptxt">reprise manuelle</text>
