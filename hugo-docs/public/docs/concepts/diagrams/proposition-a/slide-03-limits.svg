      .title { font: 700 44px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 23px Arial, sans-serif; fill: #334155; }
      .chip { fill: #fff7ed; stroke: #d97706; stroke-width: 2.2; rx: 12; }
      .chiptxt { font: 600 20px Arial, sans-serif; fill: #7c2d12; }
