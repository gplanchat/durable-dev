baseURL = 'https://durable.rocks/'
locale = 'en-US'
title = 'Durable'
defaultContentLanguage = 'en'
# English stays at the root and French lives under /fr/. Without this false, Hugo would move
# English to /en/ as well and break every published URL.
defaultContentLanguageInSubdir = false
enableGitInfo = true

# `/llms.txt` (#253): an index of the user guide for coding agents and for Context7, which
# indexes a site from it. Built from the pages themselves, so it cannot drift from the guide.
[outputFormats.llms]
mediaType = 'text/plain'
baseName = 'llms'
isPlainText = true
notAlternative = true

[outputs]
home = ['html', 'rss', 'llms']

# Both the home page (`layouts/index.fr.html`) and the guide are translated: each guide page has a
# `.fr.md` sibling, rendered under /fr/docs/ (see documentation/HUGO.md). Hugo does not fall back
# from one language to the other, so a page without a sibling does not exist under /fr/docs/.
[languages]
[languages.en]
label = 'English'
weight = 1
[languages.fr]
label = 'Français'
locale = 'fr'
weight = 2

# User-facing documentation only: ../documentation/user (not ADRs/WAs; see documentation/HUGO.md).

[module]
[[module.imports]]
path = 'github.com/alex-shpak/hugo-book'

# No local `content/` is mounted: the home page lives entirely in `layouts/index.html`, which never
# reads `.Content`. A `content/_index.md` would change nothing but say something other than the page
# online. That happened once: it announced "three packages" while the site showed five, and was
# carefully fixed before anyone noticed it was rendered nowhere.
[[module.mounts]]
source = '../documentation/user'
target = 'content/docs'

# The blog. Outside `BookSection`, so hugo-book renders it with its own `list.html`
# (`book-post` markup, pagination, dated meta) instead of the book menu tree. No layout of ours.
[[module.mounts]]
source = '../documentation/blog'
target = 'content/posts'

[params]
BookRepo = 'https://github.com/gplanchat/durable-dev'
BookEditPath = 'edit/main/documentation/user'
BookSection = 'docs'
BookSearch = true
# 'auto': the doc pages follow the system theme, as the home page does.
BookTheme = 'auto'
BookToC = true
BookCollapsedLevel = 1

# `[menu]`, not `[params.menu]`. The theme reads `.Site.Menus.after`, which Hugo builds from
# `[menu]` alone; declared under `params` these three entries parse without error and render
# nowhere, which is where the first two spent their life.
[menu]
[[menu.after]]
name = 'Blog'
url = '/posts/'
weight = 5

[[menu.after]]
name = 'Repository'
url = 'https://github.com/gplanchat/durable-dev'
weight = 10

[[menu.after]]
name = 'Contributor docs (ADRs)'
url = 'https://github.com/gplanchat/durable-dev/tree/main/documentation/adr'
weight = 20

[markup]
[markup.highlight]
# Classes, not colours: `.chroma` in assets/_custom.scss colours code from the design's tokens,
# which follow the light and dark themes. Hugo's default writes Monokai inline, and an inline style
# wins over the stylesheet, so every code block stayed dark on a light page.
noClasses = false

[markup.goldmark.renderer]
unsafe = true

[markup.tableOfContents]
endLevel = 3
ordered = false
startLevel = 2

# The home page's code block is made of <div style="white-space: pre">, one per line of PHP: the
# HTML minifier flattens their indentation (it does not read inline styles). CSS and JS stay
# minified; HTML minification is dropped, 150 KB out of 5.2 MB, under a 100 MB quota.
[minify]
  disableHTML = true

# Audience measurement: Matomo Cloud, in its consent-exempt configuration. See
# ../documentation/adr/DUR048-audience-measurement-without-a-banner.md, which carries the server
# settings this file cannot express.
#
# While these two values are empty, no tag is emitted.
[params.matomo]
url = "https://durablerocks.matomo.cloud/"     # https://<instance>.matomo.cloud/  (the trailing slash matters)
siteId = "1"  # the site's id in the console
