baseURL = 'https://durable.rocks/'
languageCode = 'en-us'
title = 'Durable'
defaultContentLanguage = 'en'
enableGitInfo = true

# User-facing documentation only: ../documentation/user (not ADRs/WAs — see documentation/HUGO.md).

[module]
[[module.imports]]
path = 'github.com/alex-shpak/hugo-book'

# Déclarer un montage remplace les montages par défaut du module projet : le
# dossier content/ local doit donc être remonté explicitement, sinon la page
# d'accueil du site n'est jamais lue.
[[module.mounts]]
source = 'content'
target = 'content'

[[module.mounts]]
source = '../documentation/user'
target = 'content/docs'

[params]
BookRepo = 'https://github.com/gplanchat/durable-dev'
BookEditPath = 'edit/main/documentation/user'
BookSection = 'docs'
BookSearch = true
# 'auto' : les pages de doc suivent le thème du système, comme la page d'accueil.
BookTheme = 'auto'
BookToC = true
BookCollapsedLevel = 1

[params.menu]
[[params.menu.after]]
name = 'Repository'
url = 'https://github.com/gplanchat/durable-dev'
weight = 10

[[params.menu.after]]
name = 'Contributor docs (ADRs)'
url = 'https://github.com/gplanchat/durable-dev/tree/main/documentation/adr'
weight = 20

[markup]
[markup.goldmark.renderer]
unsafe = true

[markup.tableOfContents]
endLevel = 3
ordered = false
startLevel = 2
