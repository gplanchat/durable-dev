baseURL = 'https://durable.rocks/'
languageCode = 'en-us'
title = 'Durable'
defaultContentLanguage = 'en'
# L'anglais reste à la racine ; le français vit sous /fr/. Sans ce faux, Hugo
# déplacerait aussi l'anglais dans /en/ et casserait toutes les URL en ligne.
defaultContentLanguageInSubdir = false
enableGitInfo = true

# La page d'accueil est le seul contenu traduit : `layouts/index.fr.html`. Le
# guide reste anglais et n'est pas remonté sous /fr/ — un second exemplaire
# complet de l'arbre servirait de l'anglais à des URL françaises.
[languages]
[languages.en]
label = 'English'
weight = 1
[languages.fr]
label = 'Français'
locale = 'fr'
weight = 2

# User-facing documentation only: ../documentation/user (not ADRs/WAs — see documentation/HUGO.md).

[module]
[[module.imports]]
path = 'github.com/alex-shpak/hugo-book'

# Déclarer un montage remplace les montages par défaut du module projet : le
# dossier content/ local doit donc être remonté explicitement, sinon Hugo ne
# voit plus de section locale du tout.
#
# Il est vide à dessein. La page d'accueil est **entièrement** dans
# `layouts/index.html`, qui ne lit jamais `.Content` : un `content/_index.md`
# n'y changerait rien, il ne ferait que dire autre chose que la page en ligne.
# C'est arrivé — il annonçait « trois paquets » alors que le site en montrait
# cinq, et quelqu'un l'a corrigé consciencieusement avant de s'apercevoir qu'il
# n'était rendu nulle part.
[[module.mounts]]
source = 'content'
target = 'content'

[[module.mounts]]
source = '../documentation/user'
target = 'content/docs'

[params]
BookRepo = 'https://github.com/gplanchat/durable-dev'
BookEditPath = 'edit/main/documentation/user'
BookSection = 'docs'
BookSearch = true
# 'auto' : les pages de doc suivent le thème du système, comme la page d'accueil.
BookTheme = 'auto'
BookToC = true
BookCollapsedLevel = 1

[params.menu]
[[params.menu.after]]
name = 'Repository'
url = 'https://github.com/gplanchat/durable-dev'
weight = 10

[[params.menu.after]]
name = 'Contributor docs (ADRs)'
url = 'https://github.com/gplanchat/durable-dev/tree/main/documentation/adr'
weight = 20

[markup]
[markup.goldmark.renderer]
unsafe = true

[markup.tableOfContents]
endLevel = 3
ordered = false
startLevel = 2

# Le bloc de code de la home est fait de <div style="white-space: pre">, une
# ligne par ligne de PHP : le minifieur HTML écrase leur indentation (il ne lit
# pas les styles inline). On garde la minification CSS/JS, on lâche celle du
# HTML — 150 Ko sur 5,2 Mo, sous un quota de 100 Mo.
[minify]
  disableHTML = true

# Mesure d'audience — Matomo Cloud, en configuration exemptée de consentement.
# Voir ../documentation/adr/DUR048-audience-measurement-without-a-banner.md, qui
# porte les réglages serveur que ce fichier ne peut pas exprimer.
#
# Tant que ces deux valeurs sont vides, aucune balise n'est émise.
[params.matomo]
url = "https://durablerocks.matomo.cloud/"     # https://<instance>.matomo.cloud/  — la barre finale compte
siteId = "1"  # l'identifiant du site dans la console
