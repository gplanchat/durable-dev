# Symfony CLI: runs workers in parallel with `symfony serve` (from this directory).
# Under Temporal (APP_ENV=dev, DURABLE_DSN) the Durable bundle registers these workers itself:
# - durable_workflows: polls workflow tasks (WorkflowTaskProcessor).
# - durable_activities: polls activity tasks (TemporalActivityWorker → ActivityMessageProcessor).
# - durable_nexus: polls Nexus tasks, for the operations this application serves.
#
# Prerequisites: APP_ENV=dev, ext-grpc, `docker compose up -d`.

workers:
    durable_workflows_1:
        cmd: ['symfony', 'console', 'messenger:consume', 'durable_workflows', '-vv']
        watch: ['config', 'src', 'templates', 'vendor/composer/installed.json']
    durable_workflows_2:
        cmd: ['symfony', 'console', 'messenger:consume', 'durable_workflows', '-vv']
        watch: ['config', 'src', 'templates', 'vendor/composer/installed.json']
    durable_activities_1:
        cmd: ['symfony', 'console', 'messenger:consume', 'durable_activities', '-vv']
        watch: ['config', 'src', 'templates', 'vendor/composer/installed.json']
    durable_activities_2:
        cmd: ['symfony', 'console', 'messenger:consume', 'durable_activities', '-vv']
        watch: ['config', 'src', 'templates', 'vendor/composer/installed.json']
    durable_nexus_1:
        cmd: ['symfony', 'console', 'messenger:consume', 'durable_nexus', '-vv']
        watch: ['config', 'src', 'templates', 'vendor/composer/installed.json']
    docker_compose:
        cmd: ['docker', 'compose', 'up']
        watch: ['compose.yaml', 'compose.override.yaml', 'docker-compose.yaml', 'docker-compose.override.yaml']