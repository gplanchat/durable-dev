# Docker stack for the Symfony demo (`./symfony/`).
#
# A single PostgreSQL (`database`): Doctrine application database + Temporal databases.
#
#   cd symfony && docker compose up -d
#
# Then on the host: `symfony serve` or `php -S` — Temporal is reachable on localhost:7233, UI on http://localhost:8088
# If port 7233 is already taken (e.g. the `compose.yaml` at the repository root): TEMPORAL_FRONTEND_PORT=17233 TEMPORAL_UI_PORT=18088 docker compose up -d
# and adapt the DSNs in `.env.local` (127.0.0.1:17233).
#
# Switching Messenger over to Temporal: see `.env.temporal.example` and `bin/console cache:clear`.
#
# Upgrading from a two-Postgres stack: stop the containers, remove the obsolete
# `temporal_pg_data` volume (`docker volume rm …`), then recreate the Temporal database in Postgres
# (see `docker/postgres/docker-entrypoint-initdb.d/99-temporal.sql`) or run this SQL once
# if the `database_data` volume already existed without those objects.

services:
###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    entrypoint: ["/bin/sh", "/usr/local/bin/entrypoint-temporal.sh"]
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck-temporal.sh"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      - ./docker/postgres/docker-entrypoint-initdb.d/99-temporal.sql:/docker-entrypoint-initdb.d/99-temporal.sql:ro
      - ./docker/postgres/temporal-bootstrap.sh:/usr/local/bin/temporal-bootstrap.sh:ro
      - ./docker/postgres/entrypoint-temporal.sh:/usr/local/bin/entrypoint-temporal.sh:ro
      - ./docker/postgres/healthcheck-temporal.sh:/usr/local/bin/healthcheck-temporal.sh:ro
###< doctrine/doctrine-bundle ###

###> temporal (demo / durable-bridge-temporal) ###
  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: database
    ports:
      - "${TEMPORAL_FRONTEND_PORT:-7233}:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 60s

  temporal-ui:
    image: temporalio/ui:2.34.0
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:${TEMPORAL_UI_PORT:-8088}
    ports:
      - "${TEMPORAL_UI_PORT:-8088}:8080"
###< temporal ###

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
