# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Une application, deux domaines en option : voir `.env`. Vides, aucune contrainte d'hôte. Les
    # contrôleurs portent la contrainte au niveau de la classe, ce qui fait de l'hôte une propriété
    # de la facette et pas de chaque route.
    app.host.samples: '%env(APP_HOST_SAMPLES)%'
    app.host.agent: '%env(APP_HOST_AGENT)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # Tag workflows for auto-registration (see also #[AsDurableActivity] on the handlers)
    App\Durable\Workflow\:
        resource: '../src/Durable/Workflow/'
        tags: [durable.workflow]

    App\Samples\Workflow\:
        resource: '../src/Samples/Workflow/'
        tags: [durable.workflow]

    App\Ai\Workflow\:
        resource: '../src/Ai/Workflow/'
        tags: [durable.workflow]

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Le seul endroit qui parle au fournisseur. Sans MISTRAL_API_KEY, la fabrique rend le client
    # scripté et la démo reste utilisable telle quelle.
    Symfony\AI\Platform\ModelClientInterface:
        factory: ['App\Ai\Platform\ModelClientFactory', 'create']
        arguments:
            $apiKey: '%env(MISTRAL_API_KEY)%'

    App\Durable\DurableSampleWorkflowRunner:
        arguments:
            $workflowClient: '@?Gplanchat\Bridge\Temporal\WorkflowClientInterface'

    App\Dashboard\TemporalEventsDashboardDataProvider:
        arguments:
            $workflowServiceClient: '@?durable.temporal.workflow_service_client'
            $connection: '@?durable.temporal.connection'
            $historyCursor: '@?Gplanchat\Bridge\Temporal\Grpc\TemporalHistoryCursor'

# Temporal journal in dev/prod: durable.yaml when@dev / when@prod + DURABLE_DSN (temporal://…).
# Prerequisites: ext-grpc, the docker compose stack, messenger workers durable_temporal_journal + durable_temporal_activity.

# The test bench has no cluster: `temporal.dsn` is null there, and a Nexus handler declared on a
# backend with no route is refused at startup — rightly so, since it would never receive anything.
#
# `autoconfigure: false` removes the tag without removing the class: it was the
# `#[AsNexusServiceHandler]` attribute that put it there. The service stays, nobody serves it, and
# the refusal no longer has a reason to fire.
when@test:
    services:
        # `autowire` explicitly: redefining a service inside a `when@` block **replaces** the
        # definition that came from loading `App\`, and the `_defaults` of the main block do not
        # apply to it. This class has no constructor today; the day it gets one, the omission would
        # show up as an `ArgumentCountError` in the test suite.
        App\Durable\Nexus\BillingHandler:
            autowire: true
            autoconfigure: false
