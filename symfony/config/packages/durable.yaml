# Journal: in memory by default and in test; Temporal in dev and prod, at DURABLE_DSN.
durable:
    backend: in_memory
    activity_transport:
        type: messenger
        transport_name: durable_activities
    child_workflow:
        async_messenger: true
    activity_contracts:
        cache: cache.app
        contracts:
            - App\Durable\Activity\GreetingActivityInterface
            - App\Durable\Activity\EchoActivityInterface
            - App\Durable\Activity\TickActivityInterface
            - App\Durable\Activity\ChargeActivityInterface

when@dev:
    durable:
        backend: temporal
        temporal:
            dsn: '%env(DURABLE_DSN)%'
            # compose.yaml and bin/demo-nexus register them on every namespace this bench uses.
            search_attributes: true

when@prod:
    durable:
        backend: temporal
        temporal:
            dsn: '%env(DURABLE_DSN)%'
            # compose.yaml and bin/demo-nexus register them on every namespace this bench uses.
            search_attributes: true

when@test:
    durable:
        child_workflow:
            async_messenger: false
